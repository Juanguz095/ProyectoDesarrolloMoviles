name: AuditLab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype-contract-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check_contract.py
      - run: python -m unittest discover -s contracts/tests -v
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s backend/api/tests -v
      - run: node --test backend/api/tests/revocation.test.cjs
  native-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/gradle.py :apps:agent:assembleDebug :apps:control:assembleDebug :apps:agent:lintDebug :apps:control:lintDebug :backend:ktor:test :backend:ktor:installDist --no-daemon
      - run: python3 scripts/check_ktor.py
  postgres-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check_postgres.py
      - run: python3 scripts/check_database.py
