name: AuditLab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype-contract-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.lock
      - run: python scripts/check_contract.py
      - run: python -m unittest discover -s contracts/tests -v
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python -m unittest discover -s backend/api/tests -v
      - run: node --test backend/api/tests/revocation.test.cjs
  native-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform and build tools
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          command -v sdkmanager
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/gradle.py :apps:common:test :apps:agent:testDebugUnitTest :apps:control:testDebugUnitTest :apps:agent:assembleDebug :apps:control:assembleDebug :apps:agent:assembleDebugAndroidTest :apps:control:assembleDebugAndroidTest :apps:agent:lintDebug :apps:control:lintDebug :backend:ktor:test :backend:ktor:installDist --no-daemon
      - name: Audit built APKs
        run: python3 scripts/check_apk.py
      - run: python3 scripts/check_ktor.py
      - name: Review production runtime advisories
        run: python3 scripts/check_dependencies.py --prepare
  postgres-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check_postgres.py
      - run: python3 scripts/check_database.py
