<svg xmlns="http://www.w3.org/2000/svg" width="390" height="816" viewBox="0 0 390 816"><title>29 · Pantalla compartida</title><rect width="390" height="816" fill="#DAD7C0"/>
<text x="24" y="43" font-family="DejaVu Sans, Inter, sans-serif" font-size="11" font-weight="400" fill="#66675A">AUDITLAB / CENTRO DE CONTROL</text>
<text x="24" y="84" font-family="DejaVu Sans, Inter, sans-serif" font-size="24" font-weight="700" fill="#10110C">PANTALLA EN VIVO</text>
<text x="24" y="113" font-family="DejaVu Sans, Inter, sans-serif" font-size="12" font-weight="400" fill="#66675A">SESIÓN AUTORIZADA DESDE EL AGENTE</text>
<rect x="24" y="130" width="342" height="1" fill="#66675A" stroke="none" stroke-width="0.7"/>
<rect x="24" y="152" width="342" height="176" fill="#F0EDDB" stroke="#66675A" stroke-width="0.7"/>
<text x="40" y="186" font-family="DejaVu Sans, Inter, sans-serif" font-size="18" font-weight="700" fill="#10110C">Pantalla compartida</text>
<text x="40" y="217" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#10110C">[Contenido compartido por el propietario]</text>
<text x="40" y="238" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#10110C"></text>
<text x="40" y="259" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#10110C">Referencia visual, sin imagen privada.</text>
<text x="40" y="280" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#10110C"></text>
<text x="40" y="301" font-family="DejaVu Sans, Inter, sans-serif" font-size="14" font-weight="400" fill="#10110C">Actualización aproximada cada segundo.</text>
<text x="24" y="361" font-family="DejaVu Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#66675A">El propietario controla el inicio y el fin. No se graba</text>
<text x="24" y="381" font-family="DejaVu Sans, Inter, sans-serif" font-size="13" font-weight="400" fill="#66675A">video ni audio.</text>
<rect x="24" y="398" width="342" height="48" fill="#10110C" stroke="#66675A" stroke-width="0.7"/>
<text x="38" y="423" font-family="DejaVu Sans, Inter, sans-serif" font-size="13" font-weight="700" fill="#F0EDDB">CERRAR VISOR</text>
<rect x="24" y="760" width="342" height="1" fill="#66675A" stroke="none" stroke-width="0.7"/>
</svg>