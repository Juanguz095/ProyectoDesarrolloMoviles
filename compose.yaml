services:
  db:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_DB: auditlab
      POSTGRES_USER: auditlab
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      POSTGRES_PASSWORD: ${AUDITLAB_DB_PASSWORD:?Set AUDITLAB_DB_PASSWORD securely before starting the development database}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - auditlab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auditlab -d auditlab']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  auditlab-pgdata:
