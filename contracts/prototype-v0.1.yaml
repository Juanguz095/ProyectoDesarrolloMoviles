openapi: 3.1.0
info:
  title: AuditLab API
  version: 0.1.0
  description: >-
    API inicial para monitoreo autorizado. Solo acepta eventos propios de la
    aplicación y metadatos permitidos; no recibe contenido de SMS, llamadas ni chats.
servers:
  - url: https://api.auditlab.example/v1
    description: URL ilustrativa; configurar el host del entorno antes de desplegar.
tags:
  - name: Enrollment
  - name: Events
  - name: Devices
  - name: Audit
paths:
  /auth/login:
    post:
      tags: [Enrollment]
      summary: Iniciar sesión en el centro de control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, enum: [admin, auditor] }
                password: { type: string, minLength: 1 }
      responses:
        '200':
          description: Token de acceso temporal.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn, role]
                properties:
                  accessToken: { type: string }
                  tokenType: { const: Bearer }
                  expiresIn: { type: integer }
                  role: { type: string, enum: [admin, auditor] }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /devices/enroll:
    post:
      tags: [Enrollment]
      summary: Inscribir un dispositivo con consentimiento vigente
      description: El código de inscripción es de un solo uso. El cliente debe mostrar y registrar el consentimiento antes de llamar esta ruta.
      security:
        - EnrollmentCode: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '201':
          description: Dispositivo inscrito; la credencial se muestra una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Código usado, vencido o dispositivo revocado.
  /devices/enrollment-code:
    post:
      tags: [Enrollment]
      summary: Crear un código de inscripción de un solo uso
      description: Solo admin. El código vence en 10 minutos y se devuelve una sola vez.
      security:
        - UserBearer: []
      responses:
        '201':
          description: Código listo para compartir manualmente con el agente.
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresIn]
                properties:
                  code: { type: string }
                  expiresIn: { type: integer, const: 600 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events:
    post:
      tags: [Events]
      summary: Recibir un lote de eventos del agente
      security:
        - DeviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '202':
          description: Lote validado para procesamiento; eventos duplicados se reportan sin volver a insertarse.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBatchResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: El dispositivo fue revocado o el consentimiento ya no está vigente.
    get:
      tags: [Events]
      summary: Consultar eventos con filtros
      security:
        - UserBearer: []
      parameters:
        - in: query
          name: device
          schema: { type: string, format: uuid }
        - in: query
          name: category
          schema: { $ref: '#/components/schemas/EventCategory' }
        - in: query
          name: from
          description: Inicio inclusivo en UTC (RFC 3339).
          schema: { type: string, format: date-time }
        - in: query
          name: to
          description: Fin exclusivo en UTC (RFC 3339).
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Página de eventos; esta consulta queda auditada.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /events/export.csv:
    get:
      tags: [Events]
      summary: Exportar eventos recientes como CSV
      description: Exportación limitada a los últimos 10000 eventos vigentes; queda auditada.
      security:
        - UserBearer: []
      responses:
        '200':
          description: Archivo CSV.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices:
    get:
      tags: [Devices]
      summary: Listar dispositivos accesibles al usuario
      security:
        - UserBearer: []
      responses:
        '200':
          description: Dispositivos y su estado de conexión.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{deviceId}/revoke:
    post:
      tags: [Devices]
      summary: Revocar un dispositivo
      description: Solo admin. Invalida la credencial del dispositivo y audita la acción.
      security:
        - UserBearer: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Dispositivo revocado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Dispositivo no encontrado. }
  /devices/{deviceId}/consent-revoke:
    post:
      tags: [Devices]
      summary: Revocar el consentimiento desde el dispositivo agente
      description: El token del agente solo puede revocar su propio dispositivo y queda invalidado.
      security:
        - DeviceBearer: []
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Consentimiento revocado y token invalidado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Dispositivo ya revocado. }
  /audit-log:
    get:
      tags: [Audit]
      summary: Consultar accesos y acciones auditables
      security:
        - UserBearer: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Entradas paginadas; la consulta también queda auditada.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    EnrollmentCode:
      type: apiKey
      in: header
      name: X-Enrollment-Code
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-device-token
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Solicitud o dato inválido.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Credencial ausente, inválida o vencida.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: El rol autenticado no permite esta operación.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EnrollmentRequest:
      type: object
      additionalProperties: false
      required: [consentAcknowledged, consent]
      properties:
        consentAcknowledged: { type: boolean, const: true }
        consent:
          $ref: '#/components/schemas/ConsentContext'
        appVersion:
          type: string
          maxLength: 40
    EnrollmentResponse:
      type: object
      additionalProperties: false
      required: [deviceId, deviceToken, status]
      properties:
        deviceId: { type: string, format: uuid }
        deviceToken:
          type: string
          description: Opaque credential; return once and never log or persist in plaintext.
        status: { const: active }
    ConsentContext:
      type: object
      additionalProperties: false
      required: [consentId, policyVersion, acceptedAt]
      properties:
        consentId: { type: string, format: uuid }
        policyVersion: { type: string, minLength: 1, maxLength: 40 }
        acceptedAt: { type: string, format: date-time }
    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Event' }
    Event:
      type: object
      additionalProperties: false
      required: [eventId, timestamp, category, direction, sourceDevice, consentContext]
      properties:
        eventId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time, description: Hora UTC del evento. }
        category: { $ref: '#/components/schemas/EventCategory' }
        direction: { type: string, enum: [inbound, outbound, occurred] }
        sourceDevice: { type: string, format: uuid }
        consentContext: { $ref: '#/components/schemas/ConsentContext' }
        metadata:
          type: object
          description: Solo claves de la lista permitida del servidor; nunca texto libre o contenido de otras apps.
          additionalProperties: false
          properties:
            networkState: { type: string, enum: [online, offline, unknown] }
            batteryPercent: { type: integer, minimum: 0, maximum: 100 }
            appEventCode: { type: string, enum: [agent_started, sync_succeeded, sync_failed, consent_revoked] }
    EventCategory:
      type: string
      enum: [app_lifecycle, sync, device_status]
    EventBatchResult:
      type: object
      additionalProperties: false
      required: [accepted, duplicates]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicates: { type: integer, minimum: 0 }
    Device:
      type: object
      additionalProperties: false
      required: [deviceId, status, lastSeenAt]
      properties:
        deviceId: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [auditId, actorId, action, occurredAt]
      properties:
        auditId: { type: string, format: uuid }
        actorId: { type: string }
        action: { type: string, enum: [device_listed, events_queried, report_exported, device_revoked, consent_revoked, audit_log_queried, enrollment_code_created] }
        resourceId: { type: [string, 'null'], format: uuid }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [title, status]
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
